# Deploy de preview a Firebase Hosting en cada Pull Request.
name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  # Tests de firestore.rules / storage.rules en el emulador (proyecto demo-*, sin credenciales).
  rules_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/rules/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: tests/rules
      # Los tests de las Cloud Functions de grupos usan el firebase-admin del backend.
      - name: Install backend
        run: npm ci
        working-directory: backend
      - name: Tests de rules y functions
        run: npm test
        working-directory: tests/rules

  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      # Lo mismo que verify.ps1: si el typecheck o los tests fallan, no hay preview.
      # (Los tests incluyen la sincronía de los dos constants.js, que lee backend/src/.)
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: frontend
      - name: Tests
        run: npx react-scripts test --watchAll=false
        working-directory: frontend
        env:
          CI: true
      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          CI: false
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GYM_TRACKER_1AABA }}
          projectId: gym-tracker-1aaba
